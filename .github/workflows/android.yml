name: Android CI & Release

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION_CODE: ${{ github.run_number }}
  VERSION_NAME: 1.0.${{ github.run_number }}

jobs:
  build:
    name: Test ve APK derleme
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      signing_mode: ${{ steps.keystore.outputs.mode }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Birim ve arayüz testleri (Robolectric)
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Test raporlarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-raporlari
          path: |
            app/build/reports/tests/
            app/build/screenshots/
          if-no-files-found: ignore

      - name: İmzalama anahtarını hazırla
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            echo "SIGNING_STORE_FILE=$KS" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=${KEY_PASSWORD:-$STORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "mode=secrets" >> "$GITHUB_OUTPUT"
            echo "Kalıcı imzalama anahtarı (GitHub Secrets) kullanılıyor."
          else
            PASS="$(openssl rand -hex 16)"
            echo "::add-mask::$PASS"
            keytool -genkeypair -keystore "$KS" -alias temp -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=90Max Gecici Anahtar" >/dev/null
            echo "SIGNING_STORE_FILE=$KS" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=temp" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "mode=ephemeral" >> "$GITHUB_OUTPUT"
            echo "::warning::SIGNING_* secret'ları tanımlı değil. APK bu derlemeye özel geçici bir anahtarla imzalandı. Kurulum çalışır, ancak sonraki sürümler üzerine güncelleme olarak kurulamaz. README'deki 'İmzalama' bölümüne bakın."
          fi

      - name: Release APK derle
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: İmzayı doğrula ve APK'yı adlandır
        run: |
          APKSIGNER="$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/90Max-v${VERSION_NAME}.apk"
          rm -f "$SIGNING_STORE_FILE"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk
          if-no-files-found: error

  device-test:
    name: Emülatörde kurulum testi (${{ matrix.name }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: telefon API 29
            api: 29
            profile: pixel_4
          - name: tablet API 34
            api: 34
            profile: pixel_c
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist
      - name: KVM'yi etkinleştir
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: APK'yı kur, aç, ekran yönünü değiştir
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/smoke-test.sh dist
      - name: Cihaz testi çıktıları
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cihaz-testi-${{ matrix.api }}
          path: smoke-out/
          if-no-files-found: ignore

  release:
    name: GitHub Release yayımla
    needs: [build, device-test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist
      - name: ZIP paketini hazırla
        run: |
          APK="dist/90Max-v${VERSION_NAME}.apk"
          PKG="90Max-v${VERSION_NAME}"
          mkdir -p "pkg/$PKG"
          cp "$APK" "pkg/$PKG/90Max.apk"
          cp docs/KURULUM.txt "pkg/$PKG/KURULUM.txt"
          (cd pkg && zip -r "../dist/$PKG.zip" "$PKG")
          sha256sum dist/*.apk dist/*.zip | sed 's|dist/||' > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt
      - name: Sürüm notlarını yaz
        env:
          MODE: ${{ needs.build.outputs.signing_mode }}
        run: |
          {
            echo "## 90Max v${VERSION_NAME}"
            echo
            echo "**İndir:** \`90Max-v${VERSION_NAME}.zip\` (içinde \`90Max.apk\` ve \`KURULUM.txt\`) veya doğrudan \`.apk\` dosyası."
            echo
            echo "- Android 8.0 (API 26) ve üzeri telefon ve tabletler"
            echo "- Otomatik testler geçti; APK, telefon (API 29) ve tablet (API 34) emülatörlerinde kurulup açıldı ve döndürüldü."
            echo "- Commit: ${GITHUB_SHA::7}"
            echo
            if [ "$MODE" = "secrets" ]; then
              echo "İmza: kalıcı sürüm anahtarı. Önceki sürümlerin üzerine veri kaybı olmadan güncelleme olarak kurulabilir."
            else
              echo "> ⚠️ İmza: **geçici anahtar.** Depoda imzalama secret'ları henüz tanımlı değil. Bu APK temiz kurulumda sorunsuz çalışır;"
              echo "> ancak farklı anahtarla imzalanmış önceki bir sürüm yüklüyse önce **Ayarlar > Yedekleme > Dışa aktar** ile yedek al,"
              echo "> eski uygulamayı kaldır, yenisini kur ve yedeği içe aktar. Kalıcı anahtar kurulumu için README'deki 'İmzalama' bölümüne bak."
            fi
          } > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: 90Max v${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          make_latest: true
          files: |
            dist/90Max-v${{ env.VERSION_NAME }}.zip
            dist/90Max-v${{ env.VERSION_NAME }}.apk
            dist/SHA256SUMS.txt
